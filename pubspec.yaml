name: wordsmemory
description: Offline vocabulary learning for Windows.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  drift: ^2.32.0
  sqlite3: ^3.0.0
  path_provider: ^2.1.5
  path: ^1.9.1
  archive: ^4.0.7
  xml: ^6.6.1
  file_picker: ^10.3.10
  local_notifier: ^0.1.6
  tray_manager: ^0.5.1
  window_manager: ^0.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.2
flutter:
  uses-material-design: true
  assets:
    - assets/tray.ico

